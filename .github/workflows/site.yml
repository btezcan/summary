name: Verify samples, build and deploy the site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  verify-samples:
    name: Verify C# and Python samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 3.14 runs every sample; 3.12 is the oldest version taught and must run
      # them the same way. Both end up on PATH as python3.14 / python3.12.
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.12
            3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Locale samples set tr-TR / tr_TR.UTF-8 explicitly; Ubuntu doesn't ship it.
      - name: Generate the Turkish locale
        run: sudo locale-gen tr_TR.UTF-8

      - name: Build, run and compare every sample
        run: node scripts/verify-samples.mjs

  build:
    name: Build the site
    needs: verify-samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # "Last updated" dates need the git history

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Read the GitHub Pages settings
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Astro build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
